services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: wastewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wastewise
      POSTGRES_USER: wastewise
      POSTGRES_PASSWORD: wastewise_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastewise -d wastewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wastewise-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://wastewise:wastewise_dev@postgres:5432/wastewise
      JWT_SECRET: wastewise-dev-secret-change-in-production-minimum-64-chars
      JWT_EXPIRES_IN: 7d
      ML_SERVICE_URL: http://ai-verification:8001
      SELF_URL: http://backend:5000
      SKIP_AI_VERIFICATION: "true"
      OPTIMIZATION_SERVICE_URL: http://optimization:8002
      CORS_ORIGIN: "*"
      BLOCKCHAIN_RPC: ""
      PRIVATE_KEY: ""
      REWARD_DISTRIBUTOR_ADDRESS: ""
    volumes:
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Verification Service ────────────────────────────────────────────────
  ai-verification:
    build:
      context: ./ai-verification
      dockerfile: Dockerfile
    container_name: wastewise-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MODEL_PATH: /app/models/wastewise_plastic_v1/best.pt
      CONFIDENCE_THRESHOLD: "0.30"
      DEVICE: cpu
      MOIRE_THRESHOLD: "0.35"
      BLUR_THRESHOLD: "50.0"
    volumes:
      - ./ai-verification/models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Route Optimization Service ─────────────────────────────────────────────
  optimization:
    build:
      context: ./optimization
      dockerfile: Dockerfile
    container_name: wastewise-optimization
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Web Client (nginx + React SPA) ────────────────────────────────────────
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: wastewise-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Hardhat local blockchain node ─────────────────────────────────────────
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: wastewise-hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8545 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
